appId: com.teamtalkie.app
productName: Team Talkie
copyright: Copyright © 2026 Team Talkie

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json
  - '!**/*.map'

asar: true
compression: normal
artifactName: ${productName}-${version}-${os}-${arch}.${ext}

protocols:
  - name: Team Talkie invite
    schemes:
      - talkie

mac:
  category: public.app-category.productivity
  icon: build/icon.png
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  target:
    - target: dmg
      arch:
        - arm64
        - x64
    - target: zip
      arch:
        - arm64
        - x64

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: Team Talkie

linux:
  icon: build/icon.png
  category: Utility
  target:
    - AppImage
    - deb
